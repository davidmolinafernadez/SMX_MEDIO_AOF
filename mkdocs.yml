site_name: AOF · 1.º SMX · Empresa en marcha
site_description: Proyecto práctico de Aplicaciones Ofimáticas 2026-2027
theme:
  name: material
  language: es
  logo: assets/images/brand-mark.svg
  favicon: assets/images/brand-mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: aof-light
      toggle:
        icon: material/weather-night
        name: Activar modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Activar modo claro
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/unit-progress.js
nav:
  - Inicio: index.md
  - Cómo trabajaremos: metodologia.md
  - Evaluación: evaluacion.md
  - Calendario: calendario.md
  - Recursos y videotutoriales: recursos.md
  - Programación: programacion.md
  - Para impartir las clases:
      - Guion docente y demostraciones: profesorado/guion-docente.md
      - Equivalencias de software: profesorado/equivalencias-software.md
  - Empresa ejemplo · NexoByte:
      - Visión general: ejemplo/index.md
      - UD00 · Fundación: ejemplo/ud00.md
      - UD01 · Suites ofimáticas: ejemplo/ud01.md
      - UD02 · Procesadores de texto: ejemplo/ud02.md
      - UD03 · Hojas de cálculo: ejemplo/ud03.md
      - UD04 · Bases de datos: ejemplo/ud04.md
      - UD05 · Imagen digital y 3D: ejemplo/ud05.md
      - UD06 · Vídeo: ejemplo/ud06.md
      - UD07 · Presentaciones: ejemplo/ud07.md
      - UD08 · Correo y agenda: ejemplo/ud08.md
      - Empresa · RA9 Soporte: ejemplo/ra9.md
