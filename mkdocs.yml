site_name: AOF · 1.º SMX · Empresa en marcha
site_description: Proyecto práctico de Aplicaciones Ofimáticas 2026-2027
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: amber
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Inicio: index.md
  - Cómo trabajaremos: metodologia.md
  - Evaluación: evaluacion.md
  - Calendario: calendario.md
  - UD0 · Fundamos la empresa: unidades/ud0.md
  - UD1 · Puestos de trabajo: unidades/ud1.md
  - UD2 · Documentos corporativos: unidades/ud2.md
  - UD3 · Comunicación: unidades/ud3.md
  - UD4 · Cuentas e inventario: unidades/ud4.md
  - UD5 · Clientes y datos: unidades/ud5.md
  - UD6 · Imagen comercial: unidades/ud6.md
  - UD7 · Presentación: unidades/ud7.md
  - UD8 · Tutorial y portafolio: unidades/ud8.md
  - UD9 · Servicio de soporte: unidades/ud9.md
  - Profesorado:
      - Coordinación A/B: profesorado/coordinacion.md
      - Mapa curricular: profesorado/mapa-curricular.md
      - Auditoría curricular: profesorado/auditoria-curricular.md
