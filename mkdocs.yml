site_name: AOF · 1.º SMX · Empresa en marcha
site_description: Proyecto práctico de Aplicaciones Ofimáticas 2026-2027
theme:
  name: material
  language: es
  logo: assets/images/brand-mark.svg
  favicon: assets/images/brand-mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: aof-light
      toggle:
        icon: material/weather-night
        name: Activar modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Activar modo claro
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/unit-progress.js
nav:
  - Inicio: index.md
  - Cómo trabajaremos: metodologia.md
  - Evaluación: evaluacion.md
  - Calendario: calendario.md
  - Recursos y videotutoriales: recursos.md
  - Programación: programacion.md
  - UD0 · Fundamos la empresa:
      - Contexto y contenidos: unidades/ud0.md
      - Prácticas y evaluación: unidades/ud0-practicas.md
  - UD1 · Puestos de trabajo:
      - Contexto y contenidos: unidades/ud1.md
      - Prácticas y evaluación: unidades/ud1-practicas.md
  - UD2 · Documentos corporativos:
      - Contexto y contenidos: unidades/ud2.md
      - Prácticas y evaluación: unidades/ud2-practicas.md
  - UD3 · Comunicación:
      - Contexto y contenidos: unidades/ud3.md
      - Prácticas y evaluación: unidades/ud3-practicas.md
  - UD4 · Cuentas e inventario:
      - Contexto y contenidos: unidades/ud4.md
      - Prácticas y evaluación: unidades/ud4-practicas.md
  - UD5 · Clientes y datos:
      - Contexto y contenidos: unidades/ud5.md
      - Prácticas y evaluación: unidades/ud5-practicas.md
  - UD6 · Imagen y fabricación:
      - Contexto y contenidos: unidades/ud6.md
      - Prácticas y evaluación: unidades/ud6-practicas.md
  - UD7 · Presentación:
      - Contexto y contenidos: unidades/ud7.md
      - Prácticas y evaluación: unidades/ud7-practicas.md
  - UD8 · Tutorial y portafolio:
      - Contexto y contenidos: unidades/ud8.md
      - Prácticas y evaluación: unidades/ud8-practicas.md
  - UD9 · Servicio de soporte:
